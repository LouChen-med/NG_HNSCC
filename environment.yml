# R and renv versions match the upstream renv.lock.
# Restore the R packages separately from renv.lock; this file is the bootstrap.
# Python is used by Seurat/reticulate for Leiden clustering.
# On Windows, run R from this project so .Rprofile loads Python igraph first.
# Upstream namespace imports also need Bioconductor 3.20 packages:
# graph=1.84.1, RBGL=1.82.0, txdbmaker=1.2.1,
# OrganismDbi=1.48.0, Homo.sapiens=1.3.1; restore scalop before infercna.
# For source installs, an obsolete Windows FLIBS path may need a local Makevars
# override pointing to the active Conda environment's Library/lib directory.
name: NG_HNSCC_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.4.1
  - r-renv=1.0.11
  - make
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - python-igraph=0.11
  - leidenalg=0.10
